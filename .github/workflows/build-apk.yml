
name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ZCL-phase2.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f ZCL-phase2.zip
          mkdir extracted
          unzip -q ZCL-phase2.zip -d extracted
          ROOT="$(find extracted -type f -name settings.gradle.kts -print -quit)"
          test -n "$ROOT"
          ROOT="${ROOT%/settings.gradle.kts}"
          cp -a "$ROOT"/. .
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build and test APK
        run: gradle test assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZCL-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
